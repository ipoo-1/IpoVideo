services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dovideo
      MYSQL_USER: dovideo
      MYSQL_PASSWORD: dovideo123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.4
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.4
    depends_on:
      - rocketmq-namesrv
    volumes:
      - ./rocketmq/broker-local.conf:/home/rocketmq/broker.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"

  backend:
    build: ./backend
    depends_on:
      - mysql
      - redis
      - minio
      - qdrant
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dovideo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: dovideo
      DB_PASSWORD: dovideo123
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      QDRANT_URL: http://qdrant:6333
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
    ports:
      - "9090:9090"

volumes:
  mysql-data:
  minio-data:
  qdrant-data:
