# 测试环境：使用内存 H2（MySQL 兼容模式），避免依赖本机 MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 测试上传目录，避免污染开发目录
app.upload.dir=target/test-uploads

# 测试环境使用虚拟对象存储凭据，生产配置不再提供默认密码
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin

# 测试使用独立的 Redis 库，避免污染开发数据
spring.data.redis.database=1

# 测试使用独立的 RocketMQ 消费者组，避免和开发环境的后端抢消息
rocketmq.producer.group=video-analysis-producer-test
rocketmq.consumer.group=video-analysis-consumer-test

# 测试允许走显式演示结果，避免 CI 依赖真实模型 Key
app.analysis.demo-mode-enabled=true

# CI should dispatch outbox quickly and remain deterministic.
app.outbox.batch-size=20
app.outbox.fixed-delay-ms=200

# Keep recovery from interfering with deterministic tests.
app.recovery.batch-size=20
app.recovery.fixed-delay-ms=60000
