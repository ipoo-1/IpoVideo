spring.application.name=ipovideo-backend
server.port=9090

# MySQL 数据源（Stage 2：从 H2 升级为真实 MySQL）
# 默认账号 dovideo/dovideo123，可用 DB_URL / DB_USERNAME / DB_PASSWORD 环境变量覆盖
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dovideo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:dovideo}
spring.datasource.password=${DB_PASSWORD:dovideo123}

# Flyway 负责表结构版本管理，启动时自动执行 db/migration 下的迁移脚本
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 上传
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 本地视频存储目录（Stage 6 会升级为 MinIO 对象存储）
app.upload.dir=${UPLOAD_DIR:uploads}

# Redis（Stage 4：会话、限流、分布式锁）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=3000ms

# RocketMQ（Stage 5：消息驱动任务）
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-producer}
rocketmq.topic.video-analysis=${ROCKETMQ_ANALYSIS_TOPIC:video-analysis-topic}
rocketmq.topic.video-analysis-dead=${ROCKETMQ_ANALYSIS_DEAD_TOPIC:video-analysis-dead-topic}
rocketmq.consumer.group=${ROCKETMQ_ANALYSIS_GROUP:video-analysis-consumer}

# MinIO（Stage 6：对象存储）
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucketName=${MINIO_BUCKET:media}

# DeepSeek（Stage 7：AI Agent，通过 SiliconFlow OpenAI 兼容接口调用）
ai.deepseek.api-key=${SILICONFLOW_API_KEY:}
ai.deepseek.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.deepseek.model=${LLM_MODEL:deepseek-ai/DeepSeek-V3.2}
ai.deepseek.timeout-seconds=${LLM_TIMEOUT_SECONDS:120}
ai.asr.url=${ASR_URL:https://api.siliconflow.cn/v1/audio/transcriptions}
ai.asr.model=${ASR_MODEL:TeleAI/TeleSpeechASR}
ai.embedding.url=${EMBEDDING_URL:https://api.siliconflow.cn/v1/embeddings}
ai.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
vector.qdrant.url=${QDRANT_URL:http://localhost:6333}
vector.qdrant.collection=${QDRANT_COLLECTION:video_segments}

# MyBatis-Plus：实体驼峰字段 <-> 数据库下划线列名自动映射
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# 业务配置：登录会话有效期
app.session.expire-hours=24
