<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IpoVideo 控制台</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
    <div>
        <div class="brand">IpoVideo</div>
        <div class="tagline">长视频内容理解与证据追踪</div>
    </div>
    <div class="topbar-actions">
        <a class="text-link" href="/swagger-ui.html" target="_blank" rel="noreferrer">API 文档</a>
        <span id="userLabel" class="user-label">未登录</span>
        <button id="logoutButton" class="button button-secondary" hidden>退出</button>
    </div>
</header>

<main class="page">
    <section id="authPanel" class="auth-layout">
        <div class="auth-copy">
            <p class="eyebrow">AI APPLICATION CONSOLE</p>
            <h1>上传视频，提出目标，获得带证据的分析结论。</h1>
            <p class="muted">前端与后端同源运行。登录后可以上传视频、创建异步任务并实时查看分析进度。</p>
        </div>
        <form id="authForm" class="form-panel">
            <div class="segmented" role="tablist">
                <button type="button" class="segment active" data-mode="login">登录</button>
                <button type="button" class="segment" data-mode="register">注册</button>
            </div>
            <label>
                <span>用户名</span>
                <input id="username" name="username" autocomplete="username" required maxlength="32">
            </label>
            <label>
                <span>密码</span>
                <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
            </label>
            <button id="authSubmit" class="button button-primary" type="submit">登录并进入</button>
            <p id="authMessage" class="message" aria-live="polite"></p>
        </form>
    </section>

    <section id="workspace" class="workspace" hidden>
        <div class="workspace-header">
            <div>
                <p class="eyebrow">ANALYSIS WORKSPACE</p>
                <h2>视频分析任务</h2>
            </div>
            <span id="healthBadge" class="status-badge status-neutral">等待任务</span>
        </div>

        <div class="workspace-grid">
            <form id="taskForm" class="panel">
                <h3>1. 选择视频</h3>
                <label class="file-field">
                    <input id="videoFile" type="file" accept="video/*" required>
                    <span id="fileLabel">选择 MP4 / MOV 视频</span>
                </label>
                <label>
                    <span>分析目标</span>
                    <textarea id="goal" rows="4" required maxlength="500">整理视频中的核心知识点，并给出可回看的证据。</textarea>
                </label>
                <button id="uploadButton" class="button button-secondary" type="button">上传视频</button>
                <div class="progress-block">
                    <div class="progress-meta"><span>上传进度</span><span id="uploadPercent">0%</span></div>
                    <progress id="uploadProgress" value="0" max="100"></progress>
                </div>
                <button id="createTaskButton" class="button button-primary" type="submit" disabled>创建分析任务</button>
                <p id="taskMessage" class="message" aria-live="polite"></p>
            </form>

            <section class="panel">
                <h3>2. 任务进度</h3>
                <div class="task-state">
                    <div><span class="label">状态</span><strong id="taskStatus">未创建</strong></div>
                    <div><span class="label">阶段</span><strong id="taskStage">-</strong></div>
                </div>
                <div class="progress-meta"><span>分析进度</span><span id="taskPercent">0%</span></div>
                <progress id="taskProgress" value="0" max="100"></progress>
                <p id="taskEventMessage" class="muted">创建任务后，这里会显示服务端推送的真实阶段。</p>
                <dl class="metadata">
                    <div><dt>mediaId</dt><dd id="mediaIdLabel">-</dd></div>
                    <div><dt>taskId</dt><dd id="taskIdLabel">-</dd></div>
                </dl>
            </section>
        </div>

        <section class="panel result-panel">
            <div class="result-header">
                <h3>3. Agent 分析结果</h3>
                <button id="refreshButton" class="button button-secondary" type="button" disabled>刷新结果</button>
            </div>
            <div id="resultContent" class="result-content muted">任务完成后，结构化结论会显示在这里。</div>
        </section>
    </section>
</main>

<script src="/app.js" defer></script>
</body>
</html>
