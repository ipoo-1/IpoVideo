name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USERPROFILE: /root
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Start middleware
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for middleware
        run: |
          for i in $(seq 1 60); do
            ok=1
            for port in 6379 6333 9000 9876 10911; do
              (echo > /dev/tcp/localhost/$port) >/dev/null 2>&1 || ok=0
            done
            if [ "$ok" = "1" ]; then break; fi
            sleep 2
          done
          curl -sf http://localhost:6333/collections >/dev/null
          curl -sf http://localhost:9000/minio/health/live >/dev/null
          for port in 6379 6333 9000 9876 10911; do
            (echo > /dev/tcp/localhost/$port) >/dev/null 2>&1
          done

      - name: Run tests
        working-directory: backend
        run: mvn -q test
