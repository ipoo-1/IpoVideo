name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run unit tests without middleware
        working-directory: backend
        run: ./mvnw -q -Dtest='!*IntegrationTest' test
