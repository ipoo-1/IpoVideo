services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.4
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.4
    depends_on:
      - rocketmq-namesrv
    volumes:
      - ./rocketmq/broker-local.conf:/home/rocketmq/broker.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
